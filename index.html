<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOL FIX RỖNG 2027 NCB</title>
    <!-- Bỏ icon website (favicon trống) -->
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            letter-spacing: 1px;
        }
        .device-id-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            text-align: center;
        }
        .device-id-box label {
            display: block;
            color: #0ff;
            font-size: 14px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .device-id-box .id-value {
            font-size: 20px;
            color: #fff;
            font-weight: bold;
            word-break: break-all;
            background: rgba(0, 255, 255, 0.1);
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed rgba(0, 255, 255, 0.5);
        }
        .key-section {
            margin-bottom: 20px;
        }
        .key-section label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .key-section input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        .key-section input:focus {
            border-color: #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .key-section input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .btn-wrapper {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        .message.error {
            color: #ff4444;
        }
        .message.success {
            color: #0ff;
        }
        .getkey-links {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }
        .getkey-links a {
            color: #0ff;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s;
        }
        .getkey-links a:hover {
            color: #fff;
            text-decoration: underline;
        }
        .timer {
            color: #ff4444;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
        /* Main tool screen */
        .tool-screen h2 {
            color: #0ff;
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .tool-screen .input-group {
            margin-bottom: 20px;
        }
        .tool-screen .input-group label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .tool-screen .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .tool-screen .input-group input:focus {
            border-color: #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        .progress-container {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            height: 30px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            position: relative;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0ff, #00b3ff);
            border-radius: 10px;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 30px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 5px #000;
            z-index: 2;
        }
        .status-text {
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .status-text.success {
            color: #0ff;
            animation: glow 1s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 5px #0ff; }
            to { text-shadow: 0 0 20px #0ff, 0 0 30px #0ff; }
        }
        .status-text.processing {
            color: #ffaa00;
        }
        .success-icon {
            font-size: 50px;
            text-align: center;
            margin: 10px 0;
        }
        .note {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }

        /* ============ NÚT VÀNG GOLD (btn-94) ============ */
        .btn-94 {
            --bg-color_94: #000;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: none;
            border-radius: 10px;
            font-family: Arial, Helvetica, sans-serif;
            cursor: pointer;
            text-decoration: none;
            user-select: none;
            transition: 500ms ease;
            width: 170px;
            height: 50px;
            z-index: 1;
            text-transform: uppercase;
            background-size: 100%;
            --bg-gold: linear-gradient(90deg, #893c15 0%, #ffde44 17%, #b1741e 24%, #ffe752 40%, #e09326 50%, #e4962a 59%, #b0781b 70%, #efb333 85%, #873a1a 100%);
            background: var(--bg-gold);
            box-sizing: border-box;
        }
        .btn-94 span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            background: var(--bg-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-94::before {
            position: absolute;
            content: '';
            inset: 3px;
            border-radius: 10px;
            background: var(--bg-color_94);
            z-index: -1;
            box-sizing: border-box;
        }
        .btn-94:hover {
            animation: move_94 5s infinite alternate ease-in-out;
            transform: scale(1.1);
        }
        .btn-94:hover span {
            animation: move_94 5s infinite alternate ease-in-out;
        }
        .btn-94:active {
            animation: move_94 1s infinite alternate ease-in-out;
        }
        .btn-94:active span {
            animation: move_94 1s infinite alternate ease-in-out;
        }
        @keyframes move_94 {
            0% { background-size: 100%; background-position: 50%; }
            50% { background-size: 500%; background-position: 0%; }
            100% { background-size: 200%; background-position: 100%; }
        }
        .btn-94:disabled {
            pointer-events: none;
            opacity: .65;
            color: #7e7e7e;
            background: #dcdcdc;
            box-shadow: none;
            --bg-color_94: #dcdcdc;
            --bg-gold: #7e7e7e;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- KEY SCREEN -->
    <div id="keyScreen">
        <h1>🔑 TOOL FIX RỖNG 2027 NCB</h1>
        
        <div class="device-id-box">
            <label>ID Thiết Bị Của Bạn</label>
            <div class="id-value" id="deviceIdDisplay">Đang tải...</div>
        </div>

        <div class="key-section">
            <label>Nhập Key Kích Hoạt</label>
            <input type="text" id="keyInput" placeholder="VD: NCB_25281" autocomplete="off">
        </div>

        <div class="btn-wrapper">
            <button class="btn-94" id="activateBtn"><span>KÍCH HOẠT</span></button>
        </div>
        
        <div class="message" id="keyMessage"></div>
        <div class="timer" id="timerDisplay"></div>

        <div class="getkey-links">
            <span style="color:#fff;">Lấy Key Tại:</span>
            <a href="https://layma.net" target="_blank">LAYMA.NET</a>
            <a href="https://yeumoney.com" target="_blank">YEUMONEY.COM</a>
        </div>
        <div class="note">Key có hiệu lực 24 giờ (giờ Việt Nam)</div>
    </div>

    <!-- TOOL SCREEN -->
    <div id="toolScreen" class="tool-screen hidden">
        <h1>🚀 FIX RỖNG TIKTOK</h1>
        <div class="input-group">
            <label>Nhập ID TikTok</label>
            <input type="text" id="tiktokIdInput" placeholder="Nhập ID TikTok cần fix..." autocomplete="off">
        </div>
        <div class="btn-wrapper">
            <button class="btn-94" id="fixBtn"><span>FIX NGAY</span></button>
        </div>

        <div class="progress-container hidden" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="status-text" id="statusText"></div>
        <div class="success-icon hidden" id="successIcon">✅</div>
        
        <div class="note" style="margin-top:20px;">
            <a href="#" id="logoutLink" style="color:#ff4444;">Đăng xuất / Đổi Key</a>
        </div>
    </div>
</div>

<script>
    // ================= CONFIG =================
    const KEY_CONFIG = {
        validKeys: [
            "NCB_25281",
            "BANGFREE1_28203",
            "YEUMONEY1_40"
        ],
        validityDuration: 24 * 60 * 60 * 1000, // 24 giờ
        fixDuration: 300 // 5 phút = 300 giây
    };

    // ================= DEVICE ID =================
    function getDeviceId() {
        let deviceId = localStorage.getItem('ncb_device_id');
        if (!deviceId) {
            const randomPart = Math.floor(Math.random() * 90000) + 10000;
            const timestamp = Date.now().toString(36).toUpperCase();
            deviceId = `NCB_${randomPart}_${timestamp}`;
            localStorage.setItem('ncb_device_id', deviceId);
        }
        return deviceId;
    }

    // ================= KEY ACTIVATION =================
    function getKeyInfo() {
        const keyInfo = localStorage.getItem('ncb_key_info');
        if (!keyInfo) return null;
        try { return JSON.parse(keyInfo); } catch { return null; }
    }

    function saveKeyInfo(key) {
        const info = {
            key: key,
            activatedAt: Date.now(),
            expiresAt: Date.now() + KEY_CONFIG.validityDuration
        };
        localStorage.setItem('ncb_key_info', JSON.stringify(info));
    }

    function isKeyValid() {
        const info = getKeyInfo();
        if (!info) return false;
        if (Date.now() > info.expiresAt) {
            localStorage.removeItem('ncb_key_info');
            return false;
        }
        return true;
    }

    function getRemainingTime() {
        const info = getKeyInfo();
        if (!info) return 0;
        return Math.max(0, info.expiresAt - Date.now());
    }

    function formatTime(ms) {
        const totalSec = Math.floor(ms / 1000);
        const hours = Math.floor(totalSec / 3600);
        const minutes = Math.floor((totalSec % 3600) / 60);
        const seconds = totalSec % 60;
        return `${hours}h ${minutes}m ${seconds}s`;
    }

    // ================= UI ELEMENTS =================
    const keyScreen = document.getElementById('keyScreen');
    const toolScreen = document.getElementById('toolScreen');
    const deviceIdDisplay = document.getElementById('deviceIdDisplay');
    const keyInput = document.getElementById('keyInput');
    const activateBtn = document.getElementById('activateBtn');
    const keyMessage = document.getElementById('keyMessage');
    const timerDisplay = document.getElementById('timerDisplay');
    const tiktokIdInput = document.getElementById('tiktokIdInput');
    const fixBtn = document.getElementById('fixBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const statusText = document.getElementById('statusText');
    const successIcon = document.getElementById('successIcon');
    const logoutLink = document.getElementById('logoutLink');

    // ================= INIT =================
    function init() {
        const deviceId = getDeviceId();
        deviceIdDisplay.textContent = deviceId;

        if (isKeyValid()) {
            showToolScreen();
        } else {
            showKeyScreen();
        }

        setInterval(() => {
            if (isKeyValid()) {
                const remaining = getRemainingTime();
                if (remaining > 0) {
                    timerDisplay.textContent = `⏰ Key còn hiệu lực: ${formatTime(remaining)}`;
                } else {
                    localStorage.removeItem('ncb_key_info');
                    showKeyScreen();
                    keyMessage.textContent = 'Key đã hết hạn, vui lòng nhập key mới!';
                    keyMessage.className = 'message error';
                }
            }
        }, 1000);

        if (isKeyValid()) {
            timerDisplay.textContent = `⏰ Key còn hiệu lực: ${formatTime(getRemainingTime())}`;
        }
    }

    function showKeyScreen() {
        keyScreen.classList.remove('hidden');
        toolScreen.classList.add('hidden');
        keyInput.value = '';
        keyMessage.textContent = '';
        keyMessage.className = 'message';
        timerDisplay.textContent = '';
        resetToolScreen();
    }

    function showToolScreen() {
        keyScreen.classList.add('hidden');
        toolScreen.classList.remove('hidden');
        if (isKeyValid()) {
            timerDisplay.textContent = `⏰ Key còn hiệu lực: ${formatTime(getRemainingTime())}`;
        }
    }

    function resetToolScreen() {
        tiktokIdInput.value = '';
        fixBtn.disabled = false;
        progressContainer.classList.add('hidden');
        progressBar.style.width = '0%';
        progressText.textContent = '0%';
        statusText.textContent = '';
        statusText.className = 'status-text';
        successIcon.classList.add('hidden');
        if (fixInterval) {
            clearInterval(fixInterval);
            fixInterval = null;
        }
    }

    // ================= KEY ACTIVATION HANDLER =================
    activateBtn.addEventListener('click', () => {
        const key = keyInput.value.trim();
        if (!key) {
            keyMessage.textContent = 'Vui lòng nhập key!';
            keyMessage.className = 'message error';
            return;
        }

        if (KEY_CONFIG.validKeys.includes(key)) {
            saveKeyInfo(key);
            keyMessage.textContent = '✅ Kích hoạt thành công! Đang chuyển hướng...';
            keyMessage.className = 'message success';
            timerDisplay.textContent = `⏰ Key còn hiệu lực: ${formatTime(KEY_CONFIG.validityDuration)}`;
            
            setTimeout(() => {
                showToolScreen();
            }, 800);
        } else {
            keyMessage.textContent = '❌ Key không hợp lệ! Vui lòng lấy key tại LAYMA.NET hoặc YEUMONEY.COM';
            keyMessage.className = 'message error';
            keyInput.value = '';
        }
    });

    keyInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') activateBtn.click();
    });

    // ================= FIX TOOL HANDLER =================
    let fixInterval = null;

    fixBtn.addEventListener('click', () => {
        if (!isKeyValid()) {
            alert('Key đã hết hạn! Vui lòng nhập key mới.');
            showKeyScreen();
            return;
        }

        const tiktokId = tiktokIdInput.value.trim();
        if (!tiktokId) {
            statusText.textContent = '⚠️ Vui lòng nhập ID TikTok!';
            statusText.className = 'status-text processing';
            return;
        }

        startFix(tiktokId);
    });

    tiktokIdInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') fixBtn.click();
    });

    function startFix(tiktokId) {
        if (fixInterval) clearInterval(fixInterval);
        
        fixBtn.disabled = true;
        progressContainer.classList.remove('hidden');
        successIcon.classList.add('hidden');
        statusText.textContent = '🔄 Đang xử lý... Vui lòng chờ trong giây lát';
        statusText.className = 'status-text processing';
        progressBar.style.width = '0%';
        progressText.textContent = '0%';

        let elapsed = 0;
        const totalDuration = KEY_CONFIG.fixDuration;

        fixInterval = setInterval(() => {
            elapsed++;
            const percent = Math.min(100, (elapsed / totalDuration) * 100);
            progressBar.style.width = percent + '%';
            progressText.textContent = Math.floor(percent) + '%';

            if (percent < 30) {
                statusText.textContent = '🔄 Đang kết nối đến máy chủ TikTok...';
            } else if (percent < 60) {
                statusText.textContent = '⚙️ Đang phân tích dữ liệu rỗng...';
            } else if (percent < 90) {
                statusText.textContent = '🔧 Đang fix rỗng... Vui lòng không tắt trang';
            } else {
                statusText.textContent = '✨ Đang hoàn tất...';
            }

            if (elapsed >= totalDuration) {
                clearInterval(fixInterval);
                fixInterval = null;
                completeFix();
            }
        }, 1000);
    }

    function completeFix() {
        progressBar.style.width = '100%';
        progressText.textContent = '100%';
        statusText.textContent = '✅ FIX THÀNH CÔNG! Vào TikTok để nhặt quà thôi! 🎁';
        statusText.className = 'status-text success';
        successIcon.classList.remove('hidden');
        fixBtn.disabled = false;
        
        const tiktokId = tiktokIdInput.value.trim();
        const history = JSON.parse(localStorage.getItem('ncb_fix_history') || '[]');
        history.push({
            id: tiktokId,
            time: new Date().toISOString(),
            deviceId: getDeviceId()
        });
        if (history.length > 20) history.shift();
        localStorage.setItem('ncb_fix_history', JSON.stringify(history));

        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            oscillator.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        } catch (e) {}
    }

    // ================= LOGOUT =================
    logoutLink.addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm('Bạn có chắc muốn đăng xuất và đổi key?')) {
            localStorage.removeItem('ncb_key_info');
            showKeyScreen();
            keyMessage.textContent = 'Đã đăng xuất. Vui lòng nhập key mới!';
            keyMessage.className = 'message';
        }
    });

    init();
</script>

</body>
</html>
